<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>OZX Level Studio — HTML Prototype</title>
  <style>
    :root {
      --ink: #e8e4d8;
      --muted: #8d918f;
      --dim: #5f6663;
      --base: #101412;
      --panel: #171c19;
      --panel-2: #1d2420;
      --panel-3: #242c27;
      --line: #343d38;
      --line-bright: #566159;
      --acid: #d6f45d;
      --acid-soft: rgba(214, 244, 93, .12);
      --cyan: #74d8d3;
      --amber: #f2b96b;
      --danger: #ef746f;
      --shadow: 0 18px 55px rgba(0, 0, 0, .36);
      --radius: 10px;
      --display: "Avenir Next Condensed", "DIN Condensed", "Arial Narrow", sans-serif;
      --body: "IBM Plex Mono", "SFMono-Regular", Consolas, monospace;
    }

    * { box-sizing: border-box; }

    html, body { height: 100%; }

    body {
      margin: 0;
      overflow: hidden;
      color: var(--ink);
      background:
        linear-gradient(rgba(255,255,255,.018) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,.018) 1px, transparent 1px),
        radial-gradient(circle at 23% 12%, #223025 0, transparent 31%),
        #0d100f;
      background-size: 24px 24px, 24px 24px, auto, auto;
      font-family: var(--body);
      font-size: 12px;
    }

    button, input, select { font: inherit; }
    button { color: inherit; }

    .app {
      height: 100%;
      display: grid;
      grid-template-rows: 52px minmax(0, 1fr) 28px;
    }

    .topbar {
      display: grid;
      grid-template-columns: auto minmax(220px, 1fr) auto;
      align-items: center;
      gap: 26px;
      padding: 0 18px;
      border-bottom: 1px solid var(--line);
      background: rgba(14, 18, 16, .92);
      backdrop-filter: blur(18px);
      box-shadow: 0 10px 28px rgba(0,0,0,.22);
      z-index: 10;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      font-family: var(--display);
      font-weight: 800;
      letter-spacing: .12em;
      font-size: 16px;
      text-transform: uppercase;
      white-space: nowrap;
    }

    .brand-mark {
      width: 26px;
      height: 26px;
      border: 1px solid var(--acid);
      position: relative;
      transform: rotate(45deg);
      box-shadow: 0 0 20px rgba(214, 244, 93, .16);
    }

    .brand-mark::before,
    .brand-mark::after {
      content: "";
      position: absolute;
      background: var(--acid);
    }

    .brand-mark::before { width: 12px; height: 2px; left: 6px; top: 11px; }
    .brand-mark::after { width: 2px; height: 12px; left: 11px; top: 6px; }

    .crumbs {
      display: flex;
      align-items: center;
      min-width: 0;
      gap: 8px;
      color: var(--muted);
    }

    .crumbs strong { color: var(--ink); font-weight: 600; }
    .crumbs .slash { color: var(--dim); }
    .crumbs .level-id {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .top-actions { display: flex; align-items: center; gap: 8px; }

    .button {
      min-height: 31px;
      padding: 0 12px;
      border: 1px solid var(--line-bright);
      border-radius: 6px;
      background: #1a201d;
      cursor: pointer;
      transition: transform .14s ease, border-color .14s ease, background .14s ease;
    }

    .button:hover { border-color: var(--acid); transform: translateY(-1px); }
    .button.primary { background: var(--acid); color: #10140f; border-color: var(--acid); font-weight: 800; }
    .button.ghost { background: transparent; border-color: transparent; color: var(--muted); }
    .button.icon { width: 31px; padding: 0; font-size: 16px; }

    .dirty-dot {
      display: inline-block;
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--amber);
      box-shadow: 0 0 12px rgba(242,185,107,.5);
      margin-right: 5px;
    }

    .main {
      min-height: 0;
      display: grid;
      grid-template-columns: minmax(720px, 1fr) 340px;
      gap: 10px;
      padding: 10px;
    }

    .workspace {
      min-width: 0;
      min-height: 0;
      display: block;
    }

    .panel {
      background: linear-gradient(145deg, rgba(31, 38, 34, .95), rgba(20, 25, 22, .98));
      border: 1px solid var(--line);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      overflow: hidden;
    }

    .room-inspector {
      display: grid;
      grid-template-columns: minmax(250px, .9fr) minmax(250px, .9fr) minmax(300px, 1.2fr);
      min-width: 0;
    }

    .inspect-column {
      min-width: 0;
      padding: 14px 16px;
      border-right: 1px solid var(--line);
      overflow: auto;
    }

    .inspect-column:last-child { border-right: 0; }
    .inspect-column.split { display: grid; grid-template-rows: auto 1fr; gap: 12px; }

    .eyebrow {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 10px;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: .13em;
      font-size: 10px;
      font-weight: 700;
    }

    .eyebrow::after { content: ""; height: 1px; flex: 1; background: var(--line); }

    .room-title-row { display: flex; align-items: center; gap: 9px; }
    .room-title-row h2 {
      margin: 0;
      font-family: var(--display);
      font-size: 27px;
      line-height: 1;
      letter-spacing: .02em;
    }

    .stage-tag {
      padding: 4px 7px;
      color: var(--acid);
      border: 1px solid rgba(214,244,93,.35);
      border-radius: 999px;
      background: var(--acid-soft);
      text-transform: uppercase;
      font-size: 9px;
      letter-spacing: .08em;
    }

    .meta-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0,1fr));
      gap: 8px;
      margin-top: 13px;
    }

    .field { min-width: 0; }
    .field label { display: block; color: var(--muted); font-size: 9px; text-transform: uppercase; letter-spacing: .08em; margin-bottom: 4px; }
    .field input, .field select {
      width: 100%;
      height: 29px;
      color: var(--ink);
      border: 1px solid var(--line);
      border-radius: 5px;
      background: #111613;
      padding: 0 8px;
      outline: none;
    }

    .field input:focus, .field select:focus { border-color: var(--cyan); box-shadow: 0 0 0 2px rgba(116,216,211,.1); }

    .door-row, .chip-row { display: flex; flex-wrap: wrap; gap: 6px; }
    .door {
      display: inline-grid;
      place-items: center;
      width: 29px;
      height: 29px;
      border: 1px solid var(--line-bright);
      border-radius: 5px;
      color: var(--dim);
      background: #121713;
      cursor: pointer;
    }

    .door.open { color: #121713; background: var(--cyan); border-color: var(--cyan); font-weight: 800; }
    .chip { padding: 4px 7px; border: 1px solid var(--line); border-radius: 4px; color: #c4c8c2; background: rgba(255,255,255,.025); font-size: 10px; }
    .chip.amber { color: var(--amber); border-color: rgba(242,185,107,.3); }

    .slot-list { display: grid; gap: 7px; }
    .slot {
      display: grid;
      grid-template-columns: 28px minmax(0, 1fr) auto;
      align-items: center;
      gap: 8px;
      padding: 7px;
      border: 1px solid var(--line);
      background: rgba(9, 13, 11, .36);
      border-radius: 6px;
    }

    .slot-icon {
      width: 28px;
      height: 28px;
      display: grid;
      place-items: center;
      border-radius: 5px;
      color: #10140f;
      background: var(--amber);
      font-weight: 900;
    }

    .slot.enemy .slot-icon { background: var(--danger); }
    .slot strong { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 11px; }
    .slot small { display: block; color: var(--muted); margin-top: 2px; }
    .slot .count { color: var(--muted); }

    .empty-copy { color: var(--dim); font-style: italic; padding: 10px 0; }

    .room-browser { min-height: 0; display: grid; grid-template-rows: 48px minmax(0, 1fr); }
    .room-list-browser { height: 100%; }
    .section-toolbar {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 0 14px;
      border-bottom: 1px solid var(--line);
      background: rgba(255,255,255,.015);
    }

    .section-toolbar h3 { margin: 0 auto 0 0; font-family: var(--display); font-size: 17px; letter-spacing: .03em; }
    .count-label { color: var(--muted); }
    .view-switch { display: flex; padding: 3px; border-radius: 6px; background: #101411; border: 1px solid var(--line); }
    .view-switch button { border: 0; padding: 4px 8px; border-radius: 4px; background: transparent; color: var(--muted); cursor: pointer; }
    .view-switch button.active { color: var(--ink); background: var(--panel-3); }

    .room-canvas {
      position: relative;
      min-height: 0;
      overflow: auto;
      padding: 18px;
      background:
        radial-gradient(circle, rgba(214,244,93,.14) 1px, transparent 1px),
        linear-gradient(135deg, rgba(214,244,93,.025), transparent 45%);
      background-size: 22px 22px, auto;
    }

    .rooms-grid {
      min-width: 920px;
      display: grid;
      grid-template-columns: minmax(0, 1fr);
      gap: 12px;
      align-items: start;
    }

    .room-list-item {
      min-height: 172px;
      display: grid;
      grid-template-columns: minmax(255px, .88fr) minmax(180px, .62fr) minmax(215px, .74fr) minmax(270px, 1fr);
      border: 1px solid var(--line);
      border-radius: 9px;
      background: linear-gradient(145deg, rgba(31,38,34,.96), rgba(18,23,20,.98));
      overflow: hidden;
      animation: reveal .38s ease both;
    }

    .room-list-item > section { min-width: 0; padding: 13px 14px; border-right: 1px solid var(--line); }
    .room-list-item > section:last-child { border-right: 0; }

    .room-core { display: grid; grid-template-rows: auto auto 1fr; gap: 10px; }
    .room-core-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; }
    .room-core h4 { margin: 3px 0 0; font-family: var(--display); font-size: 21px; letter-spacing: .02em; }
    .room-sequence { color: var(--dim); font-size: 9px; letter-spacing: .13em; }
    .room-actions { display: flex; gap: 5px; }
    .room-action { width: 27px; height: 27px; padding: 0; border: 1px solid var(--line); border-radius: 5px; color: var(--muted); background: #111613; cursor: pointer; }
    .room-action:hover { color: var(--acid); border-color: var(--acid); }

    .room-properties { display: grid; grid-template-columns: repeat(3, minmax(0,1fr)); gap: 6px; }
    .inline-select { width: 100%; height: 27px; padding: 0 6px; border: 1px solid var(--line); border-radius: 5px; color: var(--ink); background: #111613; font-size: 10px; outline: none; }
    .inline-select:focus { border-color: var(--cyan); }

    .room-bottom { display: grid; grid-template-columns: auto; gap: 12px; align-items: end; }
    .room-bottom .door-row { flex-wrap: nowrap; }
    .room-list-item .door { width: 25px; height: 25px; font-size: 9px; }
    .decorations-block { min-width: 0; }
    .micro-label { display: block; color: var(--dim); font-size: 8px; letter-spacing: .11em; text-transform: uppercase; margin-bottom: 5px; }
    .decoration-text { color: #c2c8c2; font-size: 10px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

    .content-column { display: grid; grid-template-rows: auto minmax(0,1fr); }
    .content-head { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; color: var(--muted); text-transform: uppercase; letter-spacing: .12em; font-size: 9px; font-weight: 700; }
    .content-head::after { content:""; height:1px; flex:1; background:var(--line); }
    .content-list { display: grid; align-content: start; gap: 6px; }
    .content-entry { display: grid; grid-template-columns: 25px minmax(0,1fr) 82px; align-items: center; gap: 7px; min-height: 38px; padding: 4px 6px; border: 1px solid rgba(86,97,89,.55); border-radius: 5px; background: rgba(8,12,10,.34); }
    .content-glyph { width: 25px; height: 25px; display:grid; place-items:center; border-radius:4px; color:#11140f; background:var(--amber); font-family:var(--display); font-weight:900; }
    .enemy-content .content-glyph { background: var(--danger); }
    .content-entry strong { display:block; overflow:hidden; white-space:nowrap; text-overflow:ellipsis; font-size:10px; }
    .content-entry small { display:block; margin-top:2px; color:var(--dim); font-size:8px; overflow:hidden; white-space:nowrap; text-overflow:ellipsis; }
    .quantity { height: 27px; display:grid; grid-template-columns: 23px minmax(28px,1fr) 23px; border:1px solid var(--line); border-radius:5px; overflow:hidden; background:#101512; }
    .quantity button { padding:0; border:0; color:var(--muted); background:#1c231f; cursor:pointer; }
    .quantity button:hover { color:#11140f; background:var(--acid); }
    .quantity input { min-width:0; width:100%; padding:0 2px; border:0; border-left:1px solid var(--line); border-right:1px solid var(--line); outline:0; color:var(--ink); background:#101512; text-align:center; font-size:10px; -moz-appearance:textfield; }
    .quantity input::-webkit-inner-spin-button, .quantity input::-webkit-outer-spin-button { -webkit-appearance:none; margin:0; }
    .decoration-content .content-glyph { color:#10201e; background:var(--cyan); }
    .decoration-entry { grid-template-columns: 25px minmax(0,1fr) 25px; }
    .remove-decoration { width:25px; height:25px; padding:0; border:1px solid var(--line); border-radius:4px; color:var(--muted); background:#121713; cursor:pointer; }
    .remove-decoration:hover { color:#11140f; border-color:var(--danger); background:var(--danger); }
    .decoration-add { display:grid; grid-template-columns:minmax(0,1fr) 28px; gap:5px; margin-top:7px; }
    .decoration-add select { min-width:0; width:100%; height:28px; padding:0 6px; border:1px dashed var(--line-bright); border-radius:5px; color:var(--muted); background:#101512; outline:0; font-size:9px; }
    .decoration-add button { width:28px; height:28px; padding:0; border:1px solid rgba(116,216,211,.45); border-radius:5px; color:var(--cyan); background:rgba(116,216,211,.06); cursor:pointer; }
    .decoration-add button:hover { color:#10201e; background:var(--cyan); }
    .inline-empty { display:grid; place-items:center; min-height:70px; border:1px dashed var(--line); border-radius:6px; color:var(--dim); font-size:10px; }

    .room-card {
      position: relative;
      min-height: 132px;
      padding: 12px;
      border: 1px solid #465048;
      border-radius: 8px;
      background: linear-gradient(150deg, rgba(37,45,40,.95), rgba(22,27,24,.98));
      cursor: pointer;
      transition: transform .18s ease, border-color .18s ease, box-shadow .18s ease;
      animation: reveal .38s ease both;
    }

    .room-card:hover { transform: translateY(-3px); border-color: #758076; }
    .room-card.selected { border-color: var(--acid); box-shadow: 0 0 0 1px var(--acid), 0 12px 30px rgba(0,0,0,.3), 0 0 28px rgba(214,244,93,.08); }
    .room-card::after { content: ""; position: absolute; left: 100%; top: 50%; width: 57px; height: 1px; background: #465048; }
    .room-card:nth-child(3n)::after, .room-card:last-child::after { display: none; }

    .room-card-head { display: flex; align-items: start; justify-content: space-between; gap: 10px; }
    .room-number { color: var(--dim); font-size: 9px; letter-spacing: .12em; }
    .room-card h4 { margin: 4px 0 0; font-family: var(--display); font-size: 19px; letter-spacing: .02em; }
    .room-kind { width: 8px; height: 8px; margin-top: 4px; border-radius: 50%; background: var(--cyan); box-shadow: 0 0 12px rgba(116,216,211,.45); }
    .room-kind.peak { background: var(--danger); box-shadow: 0 0 12px rgba(239,116,111,.45); }
    .room-kind.release { background: var(--amber); }

    .room-card .stats { display: flex; gap: 12px; margin-top: 20px; padding-top: 9px; border-top: 1px solid var(--line); color: var(--muted); }
    .room-card .stats b { color: var(--ink); font-weight: 600; }
    .room-card .open-dirs { position: absolute; right: 11px; bottom: 10px; color: var(--cyan); font-size: 10px; letter-spacing: .08em; }

    @keyframes reveal { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }

    .sidebar {
      min-height: 0;
      display: grid;
      grid-template-rows: 230px minmax(230px, 1fr) minmax(180px, .78fr);
      gap: 10px;
    }

    .side-head {
      height: 39px;
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 0 12px;
      border-bottom: 1px solid var(--line);
    }

    .side-head h3 { margin: 0; font-family: var(--display); letter-spacing: .05em; font-size: 14px; text-transform: uppercase; }
    .side-head .sub { margin-left: auto; color: var(--muted); font-size: 10px; }

    .minimap-wrap { display: grid; grid-template-rows: minmax(0,1fr) 42px; height: calc(100% - 39px); }
    .minimap { position: relative; margin: 14px; border: 1px solid var(--line); border-radius: 7px; background: #101512; overflow: hidden; }
    .mini-room { position: absolute; width: 28px; height: 22px; border: 1px solid #647068; border-radius: 3px; background: #263029; transition: .16s ease; }
    .mini-room.active { border-color: var(--acid); background: var(--acid); box-shadow: 0 0 14px rgba(214,244,93,.28); }
    .mini-path { position: absolute; height: 1px; background: #4d5851; transform-origin: 0 0; }

    .floor-tabs { display: grid; grid-template-columns: repeat(3, 1fr); gap: 1px; border-top: 1px solid var(--line); background: var(--line); }
    .floor-tabs button { border: 0; background: #171c19; color: var(--muted); cursor: pointer; }
    .floor-tabs button.active { color: #10140f; background: var(--acid); font-weight: 800; }

    .library { display: grid; grid-template-rows: 39px 42px minmax(0,1fr); min-height: 0; }
    .search { margin: 7px 10px 0; position: relative; }
    .search::before { content: "⌕"; position: absolute; left: 10px; top: 7px; color: var(--muted); font-size: 15px; }
    .search input { width: 100%; height: 32px; padding: 0 10px 0 31px; color: var(--ink); background: #101512; border: 1px solid var(--line); border-radius: 6px; outline: none; }
    .search input:focus { border-color: var(--acid); }

    .asset-list { overflow: auto; padding: 9px 10px 12px; display: grid; align-content: start; gap: 7px; }
    .asset-card {
      display: grid;
      grid-template-columns: 38px minmax(0,1fr) auto;
      gap: 9px;
      align-items: center;
      padding: 8px;
      border: 1px solid var(--line);
      border-radius: 7px;
      background: rgba(9,13,11,.35);
      cursor: pointer;
      transition: border-color .14s ease, background .14s ease;
    }

    .asset-card:hover, .asset-card.active { border-color: var(--cyan); background: rgba(116,216,211,.06); }
    .asset-card.static:hover, .asset-card.static.active { border-color: var(--amber); background: rgba(242,185,107,.06); }
    .portrait { width: 38px; height: 38px; border-radius: 6px; display: grid; place-items: center; color: #10140f; font-family: var(--display); font-size: 18px; font-weight: 900; background: linear-gradient(135deg, #fa8c76, var(--danger)); }
    .static .portrait { background: linear-gradient(135deg, #ffd28f, var(--amber)); }
    .asset-card strong { display: block; font-size: 11px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .asset-card small { display: block; color: var(--muted); margin-top: 3px; }
    .plus { width: 25px; height: 25px; padding: 0; border: 1px solid var(--line-bright); border-radius: 5px; background: transparent; cursor: pointer; }
    .plus:hover { color: var(--acid); border-color: var(--acid); }

    .statusbar {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 0 12px;
      color: var(--muted);
      background: #0d100e;
      border-top: 1px solid var(--line);
      font-size: 10px;
    }

    .statusbar .ok { color: var(--acid); }
    .statusbar .spacer { flex: 1; }
    .kbd { padding: 1px 5px; border: 1px solid var(--line); border-bottom-color: var(--line-bright); border-radius: 3px; color: var(--dim); }

    .toast {
      position: fixed;
      left: 50%;
      bottom: 46px;
      z-index: 20;
      min-width: 260px;
      padding: 11px 14px;
      color: #10140f;
      background: var(--acid);
      border-radius: 7px;
      box-shadow: var(--shadow);
      transform: translate(-50%, 18px);
      opacity: 0;
      pointer-events: none;
      transition: .22s ease;
      font-weight: 700;
      text-align: center;
    }

    .toast.show { opacity: 1; transform: translate(-50%, 0); }

    @media (max-width: 1100px) {
      .main { grid-template-columns: minmax(620px, 1fr) 300px; }
      .room-list-item { grid-template-columns: minmax(240px,.9fr) minmax(175px,.62fr) minmax(205px,.72fr) minmax(260px,1fr); }
    }
  </style>
</head>
<body>
  <div class="app">
    <header class="topbar">
      <div class="brand"><span class="brand-mark"></span> OZX Level Studio</div>
      <div class="crumbs">
        <span>LEVEL DATA</span><span class="slash">/</span>
        <strong class="level-id">level_chapter_01</strong><span class="slash">/</span>
        <span id="floorCrumb">FLOOR 01</span>
      </div>
      <div class="top-actions">
        <span id="dirtyLabel"><span class="dirty-dot"></span>3 changes</span>
        <button class="button ghost" id="validateBtn">Validate</button>
        <button class="button" id="previewBtn">▶ Preview</button>
        <button class="button primary" id="saveBtn">Save</button>
      </div>
    </header>

    <main class="main">
      <section class="workspace">
        <section class="panel room-browser room-list-browser" aria-label="Room list">
          <div class="section-toolbar">
            <h3>Rooms / <span id="floorTitle">Floor 01</span></h3>
            <span class="count-label" id="roomCount">6 rooms</span>
            <div class="view-switch"><button class="active">List</button><button>Compact</button></div>
            <button class="button" id="addRoomBtn">＋ Add room</button>
          </div>
          <div class="room-canvas">
            <div class="rooms-grid" id="roomsGrid"></div>
          </div>
        </section>
      </section>

      <aside class="sidebar">
        <section class="panel">
          <div class="side-head"><h3>Level layout</h3><span class="sub">OVERVIEW</span></div>
          <div class="minimap-wrap">
            <div class="minimap" id="minimap"></div>
            <div class="floor-tabs" id="floorTabs">
              <button class="active" data-floor="0">FLOOR 01</button>
              <button data-floor="1">FLOOR 02</button>
              <button data-floor="2">FLOOR 03</button>
            </div>
          </div>
        </section>

        <section class="panel library">
          <div class="side-head"><h3>Enemy library</h3><span class="sub" id="enemyLibraryCount">5 FOUND</span></div>
          <label class="search"><input id="enemySearch" placeholder="Search enemy ID, role, attack…" /></label>
          <div class="asset-list" id="enemyLibrary"></div>
        </section>

        <section class="panel library">
          <div class="side-head"><h3>Static library</h3><span class="sub" id="staticLibraryCount">4 FOUND</span></div>
          <label class="search"><input id="staticSearch" placeholder="Search cargo, hazard, prop…" /></label>
          <div class="asset-list" id="staticLibrary"></div>
        </section>
      </aside>
    </main>

    <footer class="statusbar">
      <span class="ok">● DATASET HEALTHY</span>
      <span>0 errors</span><span>2 warnings</span>
      <span class="spacer"></span>
      <span>working copy · seed 14207</span>
      <span><span class="kbd">⌘S</span> save</span>
    </footer>
  </div>

  <div class="toast" id="toast">Saved</div>

  <script>
    const enemyCatalog = [
      { id: 'enemy_cavecrawler', meta: 'ground · melee · swarm', code: 'CC' },
      { id: 'enemy_carci_patrol', meta: 'ground · ranged · patrol', code: 'CP' },
      { id: 'enemy_demolition', meta: 'ground · burst · dps', code: 'DM' },
      { id: 'enemy_flybot_scout', meta: 'air · ranged · support', code: 'FB' },
      { id: 'enemy_big_mouth', meta: 'ground · spawner · elite', code: 'BM' }
    ];

    const staticCatalog = [
      { id: 'cargo_common', meta: 'cargo · loot_common', code: 'C' },
      { id: 'toxic_barrel', meta: 'hazard · explosive', code: 'T' },
      { id: 'oil_tank', meta: 'hazard · loot_on_break', code: 'O' },
      { id: 'pinball_hammer', meta: 'device · mechanical', code: 'P' }
    ];

    const decorationCatalog = [
      'steam vents', 'pipes', 'warning lights', 'conveyor', 'sparks',
      'fans', 'alarm', 'exit beacon', 'spores', 'egg sacs', 'crates',
      'bio tanks', 'boss gate', 'transition lift'
    ];

    const floors = [
      [
        { id:'room_01_start', stage:'start', theme:'factory', template:'room_normal_01', doors:['N','E'], decorations:['steam vents','pipes'], statics:[{id:'cargo_common',count:2},{id:'oil_tank',count:1}], enemies:[{id:'enemy_carci_patrol',count:4},{id:'enemy_flybot_scout',count:3}] },
        { id:'room_02_teaching', stage:'teaching', theme:'factory', template:'room_normal_02', doors:['W','E'], decorations:['warning lights'], statics:[{id:'toxic_barrel',count:3}], enemies:[{id:'enemy_cavecrawler',count:5}] },
        { id:'room_03_building', stage:'building', theme:'factory', template:'room_wide_01', doors:['W','S'], decorations:['conveyor'], statics:[{id:'cargo_common',count:1}], enemies:[{id:'enemy_demolition',count:3},{id:'enemy_carci_patrol',count:4}] },
        { id:'room_04_pressure', stage:'pressure', theme:'factory', template:'room_normal_02', doors:['N','E'], decorations:['sparks','fans'], statics:[{id:'toxic_barrel',count:2},{id:'oil_tank',count:2}], enemies:[{id:'enemy_flybot_scout',count:5},{id:'enemy_demolition',count:2}] },
        { id:'room_05_peak', stage:'peak', theme:'factory', template:'room_wide_01', doors:['W','E'], decorations:['alarm'], statics:[{id:'pinball_hammer',count:2}], enemies:[{id:'enemy_big_mouth',count:1},{id:'enemy_cavecrawler',count:6}] },
        { id:'room_06_release', stage:'release', theme:'factory', template:'room_normal_01', doors:['W'], decorations:['exit beacon'], statics:[{id:'cargo_common',count:3}], enemies:[] }
      ],
      [
        { id:'room_11_entry', stage:'start', theme:'cave', template:'room_normal_01', doors:['E'], decorations:['spores'], statics:[{id:'oil_tank',count:1}], enemies:[{id:'enemy_cavecrawler',count:6}] },
        { id:'room_12_nest', stage:'building', theme:'cave', template:'room_wide_01', doors:['W','S'], decorations:['egg sacs'], statics:[{id:'toxic_barrel',count:2}], enemies:[{id:'enemy_big_mouth',count:1},{id:'enemy_cavecrawler',count:8}] },
        { id:'room_13_vent', stage:'pressure', theme:'cave', template:'room_normal_02', doors:['N','E'], decorations:['steam vents'], statics:[], enemies:[{id:'enemy_flybot_scout',count:4}] },
        { id:'room_14_cache', stage:'release', theme:'cave', template:'room_normal_01', doors:['W'], decorations:['crates'], statics:[{id:'cargo_common',count:4}], enemies:[] }
      ],
      [
        { id:'room_21_entry', stage:'start', theme:'bio_lab', template:'room_normal_01', doors:['E'], decorations:['bio tanks'], statics:[{id:'cargo_common',count:1}], enemies:[{id:'enemy_carci_patrol',count:5}] },
        { id:'room_22_peak', stage:'peak', theme:'bio_lab', template:'room_wide_01', doors:['W','E'], decorations:['boss gate'], statics:[{id:'pinball_hammer',count:2}], enemies:[{id:'enemy_big_mouth',count:2},{id:'enemy_demolition',count:4}] },
        { id:'room_23_exit', stage:'release', theme:'bio_lab', template:'room_normal_02', doors:['W'], decorations:['transition lift'], statics:[{id:'cargo_common',count:2}], enemies:[] }
      ]
    ];

    let floorIndex = 0;
    let selectedRoomIndex = 0;
    let dirtyChanges = 3;

    const $ = (id) => document.getElementById(id);
    const currentRoom = () => floors[floorIndex][selectedRoomIndex];
    const catalogItem = (items, id) => items.find(item => item.id === id) || { id, meta:'custom', code:'?' };

    function showToast(message) {
      const toast = $('toast');
      toast.textContent = message;
      toast.classList.add('show');
      clearTimeout(showToast.timer);
      showToast.timer = setTimeout(() => toast.classList.remove('show'), 1500);
    }

    function markDirty(delta = 1) {
      dirtyChanges += delta;
      $('dirtyLabel').innerHTML = `<span class="dirty-dot"></span>${dirtyChanges} change${dirtyChanges === 1 ? '' : 's'}`;
    }

    function renderRooms() {
      const rooms = floors[floorIndex];
      $('roomsGrid').innerHTML = rooms.map((room, index) => {
        const units = room.enemies.reduce((sum, item) => sum + item.count, 0);
        const staticEntries = room.statics.length ? room.statics.map((item, itemIndex) => {
          const source = catalogItem(staticCatalog, item.id);
          return `<div class="content-entry"><span class="content-glyph">${source.code}</span><span><strong>${item.id}</strong><small>${source.meta}</small></span><span class="quantity" data-kind="statics" data-item-index="${itemIndex}"><button data-delta="-1" title="Decrease quantity">−</button><input type="number" min="0" max="999" value="${item.count}" aria-label="${item.id} quantity"><button data-delta="1" title="Increase quantity">+</button></span></div>`;
        }).join('') : '<div class="inline-empty">No static placements</div>';
        const enemyEntries = room.enemies.length ? room.enemies.map((item, itemIndex) => {
          const source = catalogItem(enemyCatalog, item.id);
          return `<div class="content-entry"><span class="content-glyph">${source.code}</span><span><strong>${item.id}</strong><small>${source.meta}</small></span><span class="quantity" data-kind="enemies" data-item-index="${itemIndex}"><button data-delta="-1" title="Decrease quantity">−</button><input type="number" min="0" max="999" value="${item.count}" aria-label="${item.id} quantity"><button data-delta="1" title="Increase quantity">+</button></span></div>`;
        }).join('') : '<div class="inline-empty">No encounter — quiet room</div>';
        const decorationEntries = room.decorations.length ? room.decorations.map((name, decorationIndex) => `<div class="content-entry decoration-entry"><span class="content-glyph">D</span><span><strong>${name}</strong><small>room decoration</small></span><button class="remove-decoration" data-decoration-remove="${decorationIndex}" title="Remove decoration">×</button></div>`).join('') : '<div class="inline-empty">No decorations</div>';
        const decorationOptions = decorationCatalog.filter(name => !room.decorations.includes(name)).map(name => `<option value="${name}">${name}</option>`).join('');
        const stageOptions = ['start','teaching','building','pressure','peak','release'].map(value => `<option ${room.stage === value ? 'selected' : ''}>${value}</option>`).join('');
        const themeOptions = ['factory','cave','bio_lab'].map(value => `<option ${room.theme === value ? 'selected' : ''}>${value}</option>`).join('');
        const templateOptions = ['room_normal_01','room_normal_02','room_wide_01'].map(value => `<option ${room.template === value ? 'selected' : ''}>${value}</option>`).join('');
        const doors = ['N','E','S','W'].map(direction => `<button class="door ${room.doors.includes(direction) ? 'open' : ''}" data-door="${direction}" title="Toggle ${direction} door">${direction}</button>`).join('');
        return `<article class="room-list-item" data-index="${index}" style="animation-delay:${index * 42}ms">
          <section class="room-core">
            <div class="room-core-head">
              <div><span class="room-sequence">ROOM ${String(index + 1).padStart(2,'0')} · ${room.stage.toUpperCase()}</span><h4>${room.id}</h4></div>
              <div class="room-actions"><button class="room-action" title="Preview room">▶</button><button class="room-action" title="More room actions">•••</button></div>
            </div>
            <div class="room-properties">
              <select class="inline-select" data-field="stage" aria-label="Stage">${stageOptions}</select>
              <select class="inline-select" data-field="theme" aria-label="Theme">${themeOptions}</select>
              <select class="inline-select" data-field="template" aria-label="Template">${templateOptions}</select>
            </div>
            <div class="room-bottom">
              <div><span class="micro-label">Open doors</span><div class="door-row">${doors}</div></div>
            </div>
          </section>
          <section class="content-column decoration-content">
            <div class="content-head">Decorations <span>${room.decorations.length}</span></div>
            <div class="content-list">${decorationEntries}<div class="decoration-add"><select aria-label="Decoration to add">${decorationOptions || '<option value="">All added</option>'}</select><button data-decoration-add title="Add decoration">＋</button></div></div>
          </section>
          <section class="content-column">
            <div class="content-head">Static items <span>${room.statics.length}</span></div>
            <div class="content-list">${staticEntries}</div>
          </section>
          <section class="content-column enemy-content">
            <div class="content-head">Effective enemies <span>${units} units</span></div>
            <div class="content-list">${enemyEntries}</div>
          </section>
        </article>`;
      }).join('');
      [...document.querySelectorAll('.room-list-item')].forEach(card => {
        card.querySelectorAll('[data-door]').forEach(button => button.addEventListener('click', event => {
          event.stopPropagation();
          selectedRoomIndex = Number(card.dataset.index);
          const direction = button.dataset.door;
          const doors = currentRoom().doors;
          const doorIndex = doors.indexOf(direction);
          if (doorIndex >= 0) doors.splice(doorIndex, 1); else doors.push(direction);
          markDirty();
          renderAll();
        }));
        card.querySelectorAll('.quantity').forEach(control => {
          const input = control.querySelector('input');
          const updateQuantity = value => {
            const roomIndex = Number(card.dataset.index);
            const itemIndex = Number(control.dataset.itemIndex);
            const next = Math.max(0, Math.min(999, Number.isFinite(value) ? Math.round(value) : 0));
            floors[floorIndex][roomIndex][control.dataset.kind][itemIndex].count = next;
            input.value = next;
            if (control.dataset.kind === 'enemies') {
              const total = floors[floorIndex][roomIndex].enemies.reduce((sum, item) => sum + item.count, 0);
              card.querySelector('.enemy-content .content-head span').textContent = `${total} units`;
            }
            markDirty();
          };
          control.querySelectorAll('[data-delta]').forEach(button => button.addEventListener('click', event => {
            event.stopPropagation();
            updateQuantity(Number(input.value) + Number(button.dataset.delta));
          }));
          input.addEventListener('click', event => event.stopPropagation());
          input.addEventListener('change', () => updateQuantity(Number(input.value)));
        });
        card.querySelectorAll('[data-decoration-remove]').forEach(button => button.addEventListener('click', event => {
          event.stopPropagation();
          const roomIndex = Number(card.dataset.index);
          floors[floorIndex][roomIndex].decorations.splice(Number(button.dataset.decorationRemove), 1);
          markDirty();
          renderRooms();
        }));
        const decorationAdd = card.querySelector('[data-decoration-add]');
        decorationAdd.addEventListener('click', event => {
          event.stopPropagation();
          const roomIndex = Number(card.dataset.index);
          const select = decorationAdd.previousElementSibling;
          if (!select.value) return;
          floors[floorIndex][roomIndex].decorations.push(select.value);
          markDirty();
          renderRooms();
        });
        card.querySelectorAll('[data-field]').forEach(select => select.addEventListener('change', event => {
          selectedRoomIndex = Number(card.dataset.index);
          currentRoom()[select.dataset.field] = event.target.value;
          markDirty();
          renderAll();
        }));
        card.querySelector('.room-action').addEventListener('click', event => {
          event.stopPropagation();
          selectedRoomIndex = Number(card.dataset.index);
          renderAll();
          showToast(`Previewing ${currentRoom().id} with seed 14207`);
        });
      });
      $('roomCount').textContent = `${rooms.length} rooms`;
    }

    function renderMinimap() {
      const rooms = floors[floorIndex];
      const points = rooms.map((_, i) => ({ x: 12 + (i % 3) * 34, y: 18 + Math.floor(i / 3) * 48 }));
      const paths = points.slice(0,-1).map((point, i) => {
        const next = points[i + 1];
        const x1 = point.x + 7, y1 = point.y + 6, x2 = next.x + 7, y2 = next.y + 6;
        const length = Math.hypot(x2-x1, y2-y1), angle = Math.atan2(y2-y1, x2-x1) * 180 / Math.PI;
        return `<span class="mini-path" style="left:${x1}%;top:${y1}%;width:${length}%;transform:rotate(${angle}deg)"></span>`;
      }).join('');
      const nodes = points.map((point, i) => `<button class="mini-room ${i === selectedRoomIndex ? 'active' : ''}" data-index="${i}" title="${rooms[i].id}" style="left:${point.x}%;top:${point.y}%"></button>`).join('');
      $('minimap').innerHTML = paths + nodes;
      [...document.querySelectorAll('.mini-room')].forEach(node => node.addEventListener('click', () => {
        selectedRoomIndex = Number(node.dataset.index);
        renderAll();
      }));
    }

    function renderCatalog(list, targetId, query, isStatic = false) {
      const filtered = list.filter(item => `${item.id} ${item.meta}`.toLowerCase().includes(query.toLowerCase()));
      $(targetId).innerHTML = filtered.map(item => `<article class="asset-card ${isStatic ? 'static' : ''}" data-id="${item.id}">
        <span class="portrait">${item.code}</span><span><strong>${item.id}</strong><small>${item.meta}</small></span><button class="plus" title="Add to selected room">＋</button>
      </article>`).join('') || '<div class="empty-copy">No matching assets.</div>';
      $(isStatic ? 'staticLibraryCount' : 'enemyLibraryCount').textContent = `${filtered.length} FOUND`;
      [...$(targetId).querySelectorAll('.asset-card')].forEach(card => {
        card.querySelector('.plus').addEventListener('click', (event) => {
          event.stopPropagation();
          const collection = isStatic ? currentRoom().statics : currentRoom().enemies;
          const existing = collection.find(item => item.id === card.dataset.id);
          if (existing) existing.count += 1; else collection.push({ id: card.dataset.id, count: 1 });
          markDirty();
          renderAll();
          showToast(`${card.dataset.id} added to ${currentRoom().id}`);
        });
        card.addEventListener('click', () => {
          [...$(targetId).querySelectorAll('.asset-card')].forEach(x => x.classList.remove('active'));
          card.classList.add('active');
        });
      });
    }

    function renderAll() {
      $('floorCrumb').textContent = `FLOOR ${String(floorIndex + 1).padStart(2,'0')}`;
      $('floorTitle').textContent = `Floor ${String(floorIndex + 1).padStart(2,'0')}`;
      [...$('floorTabs').querySelectorAll('button')].forEach((btn, i) => btn.classList.toggle('active', i === floorIndex));
      renderRooms();
      renderMinimap();
      renderCatalog(enemyCatalog, 'enemyLibrary', $('enemySearch').value, false);
      renderCatalog(staticCatalog, 'staticLibrary', $('staticSearch').value, true);
    }

    $('floorTabs').addEventListener('click', (event) => {
      const button = event.target.closest('[data-floor]');
      if (!button) return;
      floorIndex = Number(button.dataset.floor);
      selectedRoomIndex = 0;
      renderAll();
    });

    $('enemySearch').addEventListener('input', e => renderCatalog(enemyCatalog, 'enemyLibrary', e.target.value, false));
    $('staticSearch').addEventListener('input', e => renderCatalog(staticCatalog, 'staticLibrary', e.target.value, true));

    $('addRoomBtn').addEventListener('click', () => {
      const number = floors[floorIndex].length + 1;
      floors[floorIndex].push({ id:`room_${floorIndex + 1}${number}_new`, stage:'building', theme:'factory', template:'room_normal_01', doors:[], decorations:[], statics:[], enemies:[] });
      selectedRoomIndex = floors[floorIndex].length - 1;
      markDirty();
      renderAll();
      showToast('New room created — connect its doors next');
    });

    $('saveBtn').addEventListener('click', () => {
      dirtyChanges = 0;
      $('dirtyLabel').innerHTML = '<span style="color:var(--acid)">●</span> saved';
      showToast('Working copy saved · 0 validation errors');
    });

    $('validateBtn').addEventListener('click', () => showToast('Validation complete · 0 errors · 2 warnings'));
    $('previewBtn').addEventListener('click', () => showToast(`Previewing ${currentRoom().id} with seed 14207`));

    document.addEventListener('keydown', event => {
      if ((event.metaKey || event.ctrlKey) && event.key.toLowerCase() === 's') {
        event.preventDefault();
        $('saveBtn').click();
      }
    });

    renderAll();
  </script>
</body>
</html>
